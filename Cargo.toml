[workspace]

[package]
name = "tuplet"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Tuple-based metric learning: contrastive losses, hard-negative mining, and classical Mahalanobis methods on Burn tensors"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/tuplet"
categories = ["science", "algorithms"]
include = ["/src", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
keywords = [
  "metric-learning",
  "contrastive",
  "triplet",
  "infonce",
  "mahalanobis",
]

[dependencies]
innr = { version = "0.4", optional = true }
rand = { version = "0.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

# Burn 0.22 requires Rust 1.95; the default pure-Rust feature set remains
# supported at this crate's declared Rust 1.85 floor.
burn = { version = "0.22.0", default-features = false, features = ["std", "autodiff"], optional = true }

[features]
default = ["mining"]
mining = ["dep:rand"]
serde = ["dep:serde"]
simd = ["dep:innr"]

# Private umbrella that the public burn-* features pull in; lets `burn_losses`
# gate on a single `feature = "_burn"` instead of enumerating every backend.
_burn = ["dep:burn"]

# Enable device constructors; multiple backends can coexist.
# Flex is the CPU default; ndarray and tch remain upstream compatibility paths.
burn-flex = ["_burn", "burn/flex"]
burn-ndarray = ["_burn", "burn/ndarray"]
burn-wgpu = ["_burn", "burn/wgpu"]
burn-metal = ["_burn", "burn/metal", "burn/fusion"]
burn-tch = ["_burn", "burn/tch"]
burn-cuda = ["_burn", "burn/cuda"]

[[example]]
name = "burn_training"
required-features = ["burn-flex"]

[[example]]
name = "mining_pipeline"
required-features = ["mining"]
