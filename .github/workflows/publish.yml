name: Publish tuplet to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo package version to publish
        required: true
        type: string
      commit:
        description: Full 40-character commit SHA on main to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-tuplet-to-crates-io
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Check release revision and version
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" && "$EXPECTED_SHA" == "$(git rev-parse HEAD)" ]]
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "tuplet") | .version')
          [[ "$version" == "$EXPECTED_VERSION" ]]
      - run: cargo test -p tuplet --lib
      - run: cargo publish --dry-run --registry crates-io -p tuplet

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the verified commit
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --registry crates-io -p tuplet
